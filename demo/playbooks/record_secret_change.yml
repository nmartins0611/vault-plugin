---
- name: Record a Vault secret change locally
  hosts: localhost
  gather_facts: false
  become: false
  tasks:
    - name: Write event receipt
      ansible.builtin.copy:
        dest: "{{ receipt_path }}"
        mode: "0640"
        content: |
          {
            "path": "{{ secret_path }}",
            "operation": "{{ operation }}",
            "time": "{{ event_time }}",
            "source": "vault.nostromo.io"
          }
