---
- name: Update Application and Database Passwords
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Fail if VAULT_TOKEN is missing
      ansible.builtin.fail:
        msg: "VAULT_TOKEN is required. Ensure .env is mounted in the container."
      when: lookup('env', 'VAULT_TOKEN') == ''

    - name: Fetch new password from Vault
      ansible.builtin.uri:
        url: "{{ lookup('env', 'VAULT_ADDR') }}/v1/{{ secret_path }}"
        method: GET
        headers:
          X-Vault-Token: "{{ lookup('env', 'VAULT_TOKEN') }}"
      register: vault_res
      no_log: true

    - name: Extract password from Vault response
      ansible.builtin.set_fact:
        new_password: "{{ vault_res.json.data.data.password }}"
      no_log: true

    - name: Ensure password was retrieved
      ansible.builtin.fail:
        msg: "Failed to extract password from Vault data"
      when: new_password is not defined or new_password == ''

    - name: Record event receipt locally (for demo visibility)
      ansible.builtin.copy:
        dest: "{{ receipt_path | default('/demo/out/secret-change.json') }}"
        mode: "0640"
        content: |
          {
            "path": "{{ secret_path }}",
            "operation": "{{ operation }}",
            "time": "{{ event_time }}",
            "source": "vault.nostromo.io",
            "action": "Updated rhel01 config and rhel03 database"
          }

- name: Update Database Password on rhel03
  hosts: rhel03.nostromo.io
  become: false
  tasks:
    - name: Update PostgreSQL user password
      ansible.builtin.command: >
        su - postgres -c "psql -c \"ALTER ROLE appuser WITH PASSWORD '{{ hostvars['localhost']['new_password'] }}';\""
      no_log: true

- name: Update Application Config on rhel01
  hosts: rhel01.nostromo.io
  become: false
  tasks:
    - name: Update config.ini with new password
      ansible.builtin.lineinfile:
        path: /etc/myapp/config.ini
        regexp: '^password\s*='
        line: "password = {{ hostvars['localhost']['new_password'] }}"
      no_log: true
