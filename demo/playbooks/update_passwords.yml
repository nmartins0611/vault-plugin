---
- name: Fetch rotated secret from Vault
  hosts: localhost
  gather_facts: false
  tasks:
    - name: Resolve Vault address and token
      ansible.builtin.set_fact:
        vault_api_addr: "{{ vault_addr if vault_addr is defined and vault_addr else lookup('env', 'VAULT_ADDR') }}"
        vault_api_token: "{{ vault_token if vault_token is defined and vault_token else lookup('env', 'VAULT_TOKEN') }}"
        vault_api_namespace: "{{ vault_namespace if vault_namespace is defined and vault_namespace else lookup('env', 'VAULT_NAMESPACE') }}"
      no_log: true

    - name: Fail if Vault credentials are missing
      ansible.builtin.fail:
        msg: "vault_addr/vault_token extra vars or VAULT_ADDR/VAULT_TOKEN environment variables are required"
      when: vault_api_addr == '' or vault_api_token == ''

    - name: Build Vault request headers
      ansible.builtin.set_fact:
        vault_headers: "{{ {'X-Vault-Token': vault_api_token} | combine({'X-Vault-Namespace': vault_api_namespace} if vault_api_namespace | length > 0 else {}) }}"
      no_log: true

    - name: Fetch new password from Vault
      ansible.builtin.uri:
        url: "{{ vault_api_addr }}/v1/{{ secret_path }}"
        method: GET
        headers: "{{ vault_headers }}"
        status_code:
          - 200
      register: vault_res
      no_log: true

    - name: Extract password from Vault response
      ansible.builtin.set_fact:
        new_password: "{{ vault_res.json.data.data.password }}"
      no_log: true

    - name: Ensure password was retrieved
      ansible.builtin.fail:
        msg: "Failed to extract password from Vault data at {{ secret_path }}"
      when: new_password is not defined or new_password == ''

    - name: Record event receipt locally
      ansible.builtin.copy:
        dest: "{{ receipt_path }}"
        mode: "0640"
        content: |
          {
            "path": "{{ secret_path }}",
            "operation": "{{ operation }}",
            "time": "{{ event_time }}",
            "source": "{{ vault_api_addr }}",
            "action": "Updated app config and database password"
          }
      when: receipt_path is defined and receipt_path | length > 0

- name: Update database password
  hosts: db
  become: true
  tasks:
    - name: Update PostgreSQL user password
      ansible.builtin.command:
        argv:
          - su
          - "-"
          - postgres
          - -c
          - "psql -c \"ALTER ROLE appuser WITH PASSWORD '{{ hostvars['localhost']['new_password'] }}';\""
      no_log: true

- name: Update application config
  hosts: app
  become: true
  tasks:
    - name: Update config.ini with new password
      ansible.builtin.lineinfile:
        path: /etc/myapp/config.ini
        regexp: '^password\s*='
        line: "password = {{ hostvars['localhost']['new_password'] }}"
      no_log: true
