---
- name: Setup application host
  hosts: app
  become: true
  vars:
    db_inventory_host: "{{ groups['db'][0] }}"
    db_connect_host: "{{ hostvars[db_inventory_host]['ansible_host'] | default(db_inventory_host) }}"
  tasks:
    - name: Create app directory
      ansible.builtin.file:
        path: /etc/myapp
        state: directory
        mode: "0755"

    - name: Create mock application configuration
      ansible.builtin.copy:
        dest: /etc/myapp/config.ini
        mode: "0640"
        force: false
        content: |
          [database]
          host = {{ db_connect_host }}
          port = 5432
          user = appuser
          password = initial_password
          dbname = appdb

- name: Setup database host
  hosts: db
  become: true
  tasks:
    - name: Install PostgreSQL server
      ansible.builtin.dnf:
        name: postgresql-server
        state: present

    - name: Check if PostgreSQL is initialized
      ansible.builtin.stat:
        path: /var/lib/pgsql/data/PG_VERSION
      register: pg_version

    - name: Initialize PostgreSQL database
      ansible.builtin.command: postgresql-setup --initdb
      when: not pg_version.stat.exists

    - name: Start and enable PostgreSQL service
      ansible.builtin.systemd:
        name: postgresql
        state: started
        enabled: true

    - name: Create appuser role
      ansible.builtin.command:
        argv:
          - su
          - "-"
          - postgres
          - -c
          - "psql -c \"CREATE ROLE appuser WITH LOGIN PASSWORD 'initial_password';\""
      register: create_user
      failed_when: create_user.rc != 0 and 'already exists' not in create_user.stderr and 'already exists' not in create_user.stdout

    - name: Create appdb database
      ansible.builtin.command:
        argv:
          - su
          - "-"
          - postgres
          - -c
          - createdb -O appuser appdb
      register: create_db
      failed_when: create_db.rc != 0 and 'already exists' not in create_db.stderr and 'already exists' not in create_db.stdout
