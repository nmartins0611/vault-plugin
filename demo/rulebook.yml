---
- name: Vault secret-change demo against vault.nostromo.io
  hosts: all
  sources:
    - vault_audit:
        ssh_host: vault.nostromo.io
        ssh_user: root
        audit_path: /opt/vault/logs/audit.json

  rules:
    - name: Record KV writes and update systems
      condition: event.vault.path is match("secret/(data|delete)/eda-demo/.*") and (event.vault.operation == "update" or event.vault.operation == "create" or event.vault.operation == "delete")
      action:
        run_playbook:
          name: /demo/playbooks/update_passwords.yml
          extra_vars:
            secret_path: "{{ event.vault.path }}"
            operation: "{{ event.vault.operation }}"
            event_time: "{{ event.audit.time }}"
            receipt_path: "{{ DEMO_RECEIPT }}"
