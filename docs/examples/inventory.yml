---
# Example inventory file for Event-Driven Ansible
#
# This simple inventory defines localhost for running EDA rules.
# EDA primarily uses the event source plugin and doesn't require
# a complex inventory unless you're executing playbooks against
# remote hosts in your rule actions.

all:
  hosts:
    localhost:
      ansible_connection: local
      ansible_python_interpreter: "{{ ansible_playbook_python }}"

  vars:
    # Optional: Set default variables
    ansible_host_key_checking: false
